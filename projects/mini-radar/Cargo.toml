[package]
name = "mini-radar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
panic-halt = "1.0.0"
panic-probe = { version = "1", features = ["print-defmt"] }
rp235x-hal = { version = "*", features = ["binary-info", "critical-section-impl", "rt", "defmt"] }
rp-usb-serial = { version = "0.5", default-features = false, features = ["rp2350"] }
nb = "1.1.0"
mipidsi = "0.10.0"
embedded-graphics = "0.8.2"
embedded-hal-bus = "0.3.0"
tinytga = "0.5.0"
